<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"/>
<title>Cosmopolitan Apizaco | Estética & Barbería Profesional</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #040104;
  --bg2: #0C070B;
  --bg3: #1A0E15;
  --accent: #FF2D55;
  --accent2: #FF6B8A;
  --accent-glow: rgba(255, 45, 85, 0.3);
  --gold: #D4AF37;
  --gold2: #F4D03F;
  --gold-glow: rgba(212, 175, 55, 0.2);
  --cream: #F7F0F2;
  --muted: #B8A5B0;
  --border: #2E1B26;
  --border-accent: rgba(255, 45, 85, 0.3);
  --radius: 18px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --fh: 'Playfair Display', serif;
  --fb: 'Montserrat', sans-serif;
  --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);
  --shadow-pink: 0 8px 30px rgba(255, 45, 85, 0.15);
  --shadow-gold: 0 8px 30px rgba(212, 175, 55, 0.1);
  --glass-bg: rgba(12, 7, 11, 0.75);
  --glass-border: rgba(255, 255, 255, 0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--cream);
  font-family: var(--fb);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent2); }

/* ═══════════════ NAV ═══════════════ */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.9rem 2.5rem;
  background: var(--glass-bg);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border-bottom: 1px solid var(--glass-border);
}
.logo {
  font-family: var(--fh); font-size: 1.5rem; font-weight: 700;
  cursor: pointer; letter-spacing: 0.5px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 50%, var(--gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.logo span {
  font-family: var(--fb); font-size: 0.9rem; font-weight: 300;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
nav ul { display: flex; gap: 2.5rem; list-style: none; }
nav ul a {
  font-size: 0.8rem; font-weight: 500; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
  transition: all 0.25s ease; position: relative; padding: 0.3rem 0;
}
nav ul a::after {
  content: ''; position: absolute; bottom: -2px; left: 0; width: 0;
  height: 2px; background: var(--accent); transition: width 0.3s ease;
  border-radius: 2px;
}
nav ul a:hover { color: var(--cream); }
nav ul a:hover::after { width: 100%; }

.btn-nav-book {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color: #fff; border: none; padding: 0.6rem 1.8rem; border-radius: 50px;
  font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em;
  cursor: pointer; transition: all 0.3s ease;
  box-shadow: 0 4px 20px var(--accent-glow);
  font-family: var(--fb);
}
.btn-nav-book:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(255, 45, 85, 0.5);
}

.admin-toggle {
  background: transparent; border: 1.5px solid var(--border-accent);
  color: var(--muted); padding: 0.5rem 1.3rem; border-radius: 50px;
  font-family: var(--fb); font-size: 0.75rem; font-weight: 500;
  cursor: pointer; transition: all 0.3s ease;
}
.admin-toggle:hover {
  border-color: var(--accent); color: var(--accent);
  background: rgba(255, 45, 85, 0.05);
}

/* ═══════════════ HERO ═══════════════ */
.hero {
  min-height: 100vh; display: grid; place-items: center; text-align: center;
  position: relative; overflow: hidden; padding-top: 80px;
}
.hero-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 30% 20%, rgba(255,45,85,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 70% 60%, rgba(212,175,55,0.04) 0%, transparent 50%),
    radial-gradient(ellipse 40% 30% at 50% 80%, rgba(255,107,138,0.03) 0%, transparent 50%);
}
.hero-stripes {
  position: absolute; right: -80px; top: 0; bottom: 0; width: 200px;
  display: flex; gap: 20px; opacity: .04; transform: rotate(-12deg) scaleY(1.6);
  pointer-events: none;
}
.stripe {
  flex: 1;
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent) 25%, var(--gold) 25%, var(--gold) 50%, var(--accent2) 50%, var(--accent2) 75%, var(--gold2) 75%, var(--gold2) 100%);
}
.hero-content { position: relative; z-index: 1; }
.hero-tag {
  display: inline-block; border: 1.5px solid var(--border-accent);
  color: var(--accent); font-size: 0.75rem; letter-spacing: 0.18em;
  text-transform: uppercase; padding: 0.45rem 1.6rem; border-radius: 50px;
  margin-bottom: 2rem; font-weight: 500;
  background: rgba(255, 45, 85, 0.04); backdrop-filter: blur(10px);
}
h1 {
  font-family: var(--fh); font-size: clamp(3rem, 8vw, 6rem);
  line-height: 1.05; margin-bottom: 1.2rem; font-weight: 700;
}
h1 em {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-style: normal;
}
.hero-sub {
  color: var(--muted); font-size: 1.05rem; max-width: 520px;
  margin: 0 auto 2.8rem; font-weight: 300; line-height: 1.7;
}
.hero-ctas { display: flex; gap: 1.2rem; justify-content: center; flex-wrap: wrap; }

.btn-primary {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color: #fff; border: none; padding: 0.95rem 2.5rem; border-radius: 50px;
  font-weight: 600; font-size: 0.92rem; letter-spacing: 0.05em;
  cursor: pointer; transition: all 0.35s ease;
  box-shadow: 0 8px 25px var(--accent-glow);
  font-family: var(--fb);
}
.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 35px rgba(255, 45, 85, 0.45);
}

.btn-outline {
  border: 1.5px solid var(--border-accent); color: var(--cream);
  padding: 0.95rem 2.5rem; border-radius: 50px; font-size: 0.92rem;
  font-weight: 500; cursor: pointer;
  background: rgba(255, 255, 255, 0.02); transition: all 0.35s ease;
  font-family: var(--fb);
}
.btn-outline:hover {
  border-color: var(--accent); color: var(--accent);
  box-shadow: 0 0 30px rgba(255, 45, 85, 0.2);
  background: rgba(255, 45, 85, 0.05);
}

.hero-stats {
  display: flex; gap: 3.5rem; justify-content: center;
  margin-top: 4.5rem; padding-top: 3.5rem;
  border-top: 1px solid var(--border);
}
.stat-num {
  font-family: var(--fh); font-size: 2.2rem; font-weight: 700;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-label {
  font-size: 0.78rem; color: var(--muted); letter-spacing: 0.08em;
  text-transform: uppercase; font-weight: 500; margin-top: 0.2rem;
}

/* ═══════════════ SECTIONS ═══════════════ */
section.ps { padding: 5.5rem 2.5rem; max-width: 1140px; margin: 0 auto; }
.stag {
  font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 1rem; font-weight: 600; display: block;
}
h2 {
  font-family: var(--fh); font-size: clamp(2rem, 4.5vw, 3.2rem);
  margin-bottom: 0.8rem; font-weight: 700; line-height: 1.2;
}
.sdesc { color: var(--muted); max-width: 520px; margin-bottom: 2.8rem; font-weight: 300; font-size: 0.95rem; }

/* ═══════════════ CATEGORY TABS ═══════════════ */
.cat-wrap { overflow-x: auto; white-space: nowrap; padding-bottom: 0.8rem; margin-bottom: 2rem; scrollbar-width: none; }
.cat-wrap::-webkit-scrollbar { display: none; }
.cat-tabs { display: inline-flex; gap: 0.5rem; }
.cat-tab {
  padding: 0.55rem 1.4rem; border-radius: 50px; font-size: 0.82rem;
  font-weight: 500; cursor: pointer;
  border: 1.5px solid var(--border); color: var(--muted);
  background: transparent; font-family: var(--fb);
  transition: all 0.3s ease; white-space: nowrap;
}
.cat-tab:hover { border-color: var(--accent); color: var(--accent); background: rgba(255,45,85,0.03); }
.cat-tab.active {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color: #fff; border-color: transparent; font-weight: 600;
  box-shadow: 0 4px 15px var(--accent-glow);
}

/* ═══════════════ SERVICE CARDS ═══════════════ */
.svc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.4rem; }
.svc-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.8rem 1.5rem;
  cursor: pointer; transition: all 0.35s ease;
  position: relative; overflow: hidden; box-shadow: var(--shadow-card);
}
.svc-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
  transform: scaleX(0); transform-origin: left; transition: transform 0.4s ease;
}
.svc-card:hover {
  border-color: var(--accent);
  transform: translateY(-6px);
  box-shadow: var(--shadow-pink);
}
.svc-card:hover::before, .svc-card.selected::before { transform: scaleX(1); }
.svc-card.selected {
  border-color: var(--accent);
  background: rgba(255, 45, 85, 0.04);
  box-shadow: var(--shadow-pink);
}
.svc-icon { font-size: 2rem; margin-bottom: 1rem; }
.svc-name { font-family: var(--fh); font-size: 1.1rem; margin-bottom: 0.5rem; line-height: 1.3; font-weight: 600; }
.svc-desc {
  font-size: 0.8rem; color: var(--muted); margin-bottom: 1.2rem;
  line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden;
}
.svc-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.4rem; }
.svc-price {
  color: var(--accent); font-weight: 600; font-size: 1.1rem;
}
.svc-dur {
  font-size: 0.75rem; color: var(--muted);
  background: var(--bg3); padding: 0.3rem 0.8rem; border-radius: 50px;
  font-weight: 500;
}

/* ═══════════════ BOOKING ═══════════════ */
.bwrap { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start; }
@media(max-width: 720px) { .bwrap { grid-template-columns: 1fr; } }
.cal-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.8rem; box-shadow: var(--shadow-card);
}
.cal-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
.cal-month { font-family: var(--fh); font-size: 1.2rem; font-weight: 600; }
.cal-nav {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-xs); color: var(--cream);
  padding: 0.5rem 0.9rem; cursor: pointer; font-size: 1.1rem;
  transition: all 0.25s ease;
}
.cal-nav:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 0.6rem; }
.cal-days span { font-size: 0.7rem; color: var(--muted); padding: 0.5rem 0; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-xs); font-size: 0.85rem; cursor: pointer;
  transition: all 0.2s ease; border: 1.5px solid transparent;
  position: relative; font-weight: 500;
}
.cal-day:hover:not(.disabled):not(.empty) { background: var(--bg3); border-color: var(--accent); color: var(--accent); }
.cal-day.today { color: var(--accent); font-weight: 700; border-color: rgba(255,45,85,0.3); }
.cal-day.selected { background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%); color: #fff; font-weight: 600; border-color: transparent; }
.cal-day.disabled { color: var(--border); cursor: not-allowed; opacity: 0.4; }
.cal-day.empty { cursor: default; }
.cal-day.has-apts::after {
  content: ''; position: absolute; bottom: 4px; left: 50%;
  transform: translateX(-50%); width: 5px; height: 5px;
  background: var(--accent); border-radius: 50%;
}
.cal-day.fully-booked { background: rgba(255, 45, 85, 0.08); color: #e05070; cursor: not-allowed; }

.slots-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.6rem; margin-top: 1.2rem;
  box-shadow: var(--shadow-card);
}
.slots-title { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.2rem; font-weight: 600; }
.slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 0.5rem; }
.slot {
  padding: 0.6rem 0.5rem; text-align: center;
  border: 1.5px solid var(--border); border-radius: var(--radius-xs);
  font-size: 0.82rem; cursor: pointer; transition: all 0.25s ease;
  font-weight: 500;
}
.slot:hover:not(.taken) { border-color: var(--accent); color: var(--accent); background: rgba(255,45,85,0.04); }
.slot.selected {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color: #fff; border-color: transparent; font-weight: 600;
}
.slot.taken {
  color: var(--border); cursor: not-allowed; text-decoration: line-through;
  background: rgba(255, 45, 85, 0.03); opacity: 0.5;
}
.slot-hint { font-size: 0.72rem; color: var(--muted); margin-top: 0.8rem; font-style: italic; }

/* ═══════════════ FORM ═══════════════ */
.form-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 2rem; box-shadow: var(--shadow-card);
}
.ftitle { font-family: var(--fh); font-size: 1.4rem; margin-bottom: 0.4rem; font-weight: 600; }
.fsub { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.8rem; font-weight: 300; }
.fg { margin-bottom: 1.3rem; }
label {
  display: block; font-size: 0.74rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem;
  font-weight: 500;
}
input, textarea, select {
  width: 100%; background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: var(--radius-xs); color: var(--cream); font-family: var(--fb);
  font-size: 0.9rem; padding: 0.8rem 1.1rem; transition: all 0.3s ease; outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,45,85,0.08); }
input.invalid { border-color: #e05050; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.5; }
textarea { resize: vertical; min-height: 90px; }

.fsummary {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 1.2rem;
  margin-bottom: 1.5rem; font-size: 0.87rem;
}
.sumrow { display: flex; justify-content: space-between; margin-bottom: 0.5rem; gap: 0.5rem; }
.sumrow:last-child { margin-bottom: 0; padding-top: 0.6rem; border-top: 1px solid var(--border); font-weight: 600; color: var(--accent); }
.sumlbl { color: var(--muted); flex-shrink: 0; }

.errban {
  background: rgba(255, 45, 85, 0.08); border: 1px solid rgba(255, 45, 85, 0.3);
  color: #e07070; border-radius: var(--radius-xs); padding: 0.9rem 1.2rem;
  font-size: 0.85rem; margin-bottom: 1.2rem; display: none; font-weight: 500;
}
.btn-submit { width: 100%; padding: 1.1rem; font-size: 0.95rem; border-radius: var(--radius-sm); margin-top: 0.8rem; font-weight: 600; }

/* ═══════════════ SUCCESS ═══════════════ */
.sov {
  position: fixed; inset: 0; background: rgba(4, 1, 4, 0.97);
  z-index: 200; display: none; place-items: center; text-align: center;
  backdrop-filter: blur(10px);
}
.sov.show { display: grid; }
.sbox { max-width: 440px; padding: 3rem; }
.sbox h3 { font-family: var(--fh); font-size: 2rem; margin-bottom: 1rem; font-weight: 700; }
.sbox p { color: var(--muted); margin-bottom: 2rem; line-height: 1.7; font-weight: 300; }

/* ═══════════════ SOCIAL FOOTER ═══════════════ */
.sfooter {
  background: var(--bg2); border-top: 1px solid var(--border);
  padding: 4rem 2.5rem 2rem;
}
.sfooter-grid {
  max-width: 1050px; margin: 0 auto;
  display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 3rem;
}
@media(max-width: 720px) { .sfooter-grid { grid-template-columns: 1fr; } }
.sfooter-logo {
  font-family: var(--fh); font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.sfooter-logo span {
  font-family: var(--fb); font-size: 0.85rem; font-weight: 400;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.sfooter-tagline { color: var(--muted); font-size: 0.88rem; margin-bottom: 1.2rem; font-weight: 300; }
.social-row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.8rem; }
.social-btn {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.55rem 1.1rem; border-radius: 50px;
  border: 1.5px solid var(--border); color: var(--muted);
  font-size: 0.82rem; cursor: pointer; transition: all 0.3s ease;
  background: transparent; font-family: var(--fb); font-weight: 500;
  text-decoration: none;
}
.social-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(255,45,85,0.04); box-shadow: 0 0 20px rgba(255,45,85,0.1); }
.social-btn.wa:hover { border-color: #25d366; color: #25d366; }
.social-btn.ig:hover { border-color: #e1306c; color: #e1306c; }
.social-btn.fb:hover { border-color: #1877f2; color: #1877f2; }

.sfooter-htitle {
  font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 1rem; font-weight: 600;
}
.sfooter-hrow { font-size: 0.87rem; color: var(--muted); padding: 0.35rem 0; font-weight: 300; }
.sfooter-copy {
  text-align: center; margin-top: 3rem; padding-top: 2rem;
  border-top: 1px solid var(--border); font-size: 0.8rem;
  color: var(--muted); font-weight: 300;
}

/* ═══════════════ ADMIN PANEL ═══════════════ */
.admin-panel { display: none; min-height: 100vh; background: var(--bg); padding-top: 80px; }
.admin-panel.show { display: block; }
.client-portal.hidden { display: none; }
.admin-hdr {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 1.5rem 2.5rem; display: flex; align-items: center; gap: 1rem;
}
.admin-hdr h2 { font-family: var(--fh); font-size: 1.3rem; flex: 1; color: var(--cream); }
.abadge {
  background: rgba(255,45,85,0.1); color: var(--accent);
  border: 1px solid rgba(255,45,85,0.3); font-size: 0.72rem;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding: 0.35rem 1rem; border-radius: 50px; font-weight: 500;
}
.admin-body { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 145px); }
@media(max-width: 900px) { .admin-body { grid-template-columns: 1fr; } }
.asidebar { background: var(--bg2); border-right: 1px solid var(--border); padding: 1.5rem; }
.sbtitle {
  font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent); margin: 1.5rem 0 0.7rem 0.6rem; font-weight: 600;
}
.sblink {
  display: flex; align-items: center; gap: 0.8rem;
